name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow dispatches CI on Release Please branches.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          args: check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      # The PyTorch index publishes no upload times, so the project's
      # exclude-newer cooldown would fall back to an ancient torch; skip it here.
      - name: Install CPU PyTorch
        run: uv pip install --no-config torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: uv pip install -e . --group dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/tiktoken
          key: tiktoken-${{ runner.os }}
      - name: Run tests
        run: python -m pytest -q
