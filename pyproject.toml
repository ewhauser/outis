[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-deid"
version = "0.1.0"
description = "Local clinical PHI detection, redaction and consistent synthetic replacement"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Eric Hauser" }]
keywords = ["de-identification", "phi", "clinical-nlp", "ner", "privacy", "hipaa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.6",
    "transformers>=5.6",
    "safetensors>=0.5",
    "huggingface-hub>=0.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "python-dateutil>=2.9",
    "tiktoken>=0.9",
    "numpy>=2.0",
    "regex>=2024.11",
    "defusedxml>=0.7",
    "sentencepiece>=0.2",
    "protobuf>=5",
]

[project.optional-dependencies]
# Native PDF input and output for /v1/files.
pdf = ["pypdf>=6.19.0", "reportlab>=4"]
# Token character offsets used by the legacy remediation and generalization
# corpus generators to reproduce their recorded statistics. Detection does not use it.
generators = [
    "opf @ https://github.com/openai/privacy-filter/archive/f7f00ca7fb869683eb732c010299d901457f19c3.tar.gz",
]
dev = ["clinical-deid[pdf,generators]", "pytest>=8", "httpx>=0.28", "ruff>=0.11", "psutil>=6"]

[project.urls]
Homepage = "https://github.com/ewhauser/deidentifier"
Documentation = "https://github.com/ewhauser/deidentifier/tree/main/docs"
Changelog = "https://github.com/ewhauser/deidentifier/blob/main/CHANGELOG.md"
Issues = "https://github.com/ewhauser/deidentifier/issues"

[project.scripts]
clinical-deid = "clinical_deid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
# Experiment records and frozen one-off generators are kept byte-for-byte as
# evidence; their hashes are pinned by manifests, so they are neither linted
# nor formatted.
extend-exclude = [
    "data",
    "reports",
    "experiments",
    "scripts/takeover",
    "scripts/generate_blind_qualification_*.py",
    "scripts/v*_qualification_author_qa.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RET"]
ignore = [
    "E501",  # line length is left to the formatter; long literals are allowed
    "B905",  # zip(strict=...) would change behaviour on length mismatches
    "SIM102",  # nested ifs often carry a comment per condition
    "SIM117",  # nested with blocks read more clearly in tests
    "SIM905",  # "a b c".split() is clearer than a long literal list
    "C413",  # reversed(sorted(x)) and sorted(x, reverse=True) order ties differently
]

[tool.ruff.lint.per-file-ignores]
# Verification scripts and tests build per-case closures they call immediately.
"scripts/**" = ["B023"]
"tests/**" = ["B023"]

[tool.ruff.lint.isort]
known-first-party = ["clinical_deid"]

